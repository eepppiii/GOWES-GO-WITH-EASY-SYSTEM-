<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk Admin · GOWES</title>
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/login-panel.css">
</head>

<body class="admin">
  <div class="admin-login">

    <section class="brand-panel">
      <img src="../img/logo-white.png" alt="GOWES">
      <p>Panel admin untuk petugas shelter: pantau unit, peminjaman, sanksi, dan laporan kondisi E-bike.</p>
    </section>

    <section class="form-panel">
      <div class="form-in">
        <h1>Masuk sebagai Admin</h1>
        <p>Khusus petugas shelter dan admin sistem.</p>
        <form data-go="../admin/dashboard.html">
          <select class="input" name="peran" aria-label="Peran">
            <option value="../petugas/dashboard.html">Petugas shelter</option>
            <option value="../admin/dashboard.html" selected>Admin</option>
            <option value="../superadmin/dashboard.html">Super Admin</option>
          </select>
          <input class="input" type="text" name="username" placeholder="Username" autocomplete="username">
          <input class="input" type="password" name="password" placeholder="Password" autocomplete="current-password">
          <button class="btn btn-primary" type="submit">Masuk</button>
        </form>
        <p class="staff-link"><a href="mahasiswa.html">Masuk sebagai mahasiswa</a></p>
      </div>
    </section>

  </div>
  <script src="../js/common.js"></script>
</body>

</html>
